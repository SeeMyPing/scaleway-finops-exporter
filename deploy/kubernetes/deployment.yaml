apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaleway-finops-exporter
spec:
  # One replica is enough: data refreshes hourly at most, and more replicas
  # would multiply Scaleway API calls and duplicate series.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scaleway-finops-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaleway-finops-exporter
    spec:
      serviceAccountName: scaleway-finops-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/seemyping/scaleway-finops-exporter
          imagePullPolicy: IfNotPresent
          args:
            - --scaleway.secret-key-file=/etc/scaleway/secret-key
            - --log.format=json
          env:
            - name: SCW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-finops-exporter
                  key: access-key
            - name: SCW_DEFAULT_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: scaleway-finops-exporter
                  key: organization-id
          ports:
            - name: http-metrics
              containerPort: 10056
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-metrics
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scaleway-secret-key
              mountPath: /etc/scaleway
              readOnly: true
      volumes:
        - name: scaleway-secret-key
          secret:
            secretName: scaleway-finops-exporter
            defaultMode: 0400
            items:
              - key: secret-key
                path: secret-key
