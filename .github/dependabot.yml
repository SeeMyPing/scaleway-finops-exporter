version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        # The Scaleway SDK is still v1.0.0-beta.x and its Go API may break
        # between betas: it gets its own pull request, never grouped.
        exclude-patterns: ["github.com/scaleway/scaleway-sdk-go"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
