# Example only: do not commit real credentials. Create the secret with:
#
#   kubectl -n monitoring create secret generic scaleway-finops-exporter \
#     --from-literal=access-key=SCWXXXXXXXXXXXXXXXXX \
#     --from-literal=organization-id=<organization UUID> \
#     --from-file=secret-key=./secret-key
#
# The API key needs the BillingReadOnly and EnvironmentalImpactReadOnly
# permission sets on the organization.
apiVersion: v1
kind: Secret
metadata:
  name: scaleway-finops-exporter
  namespace: monitoring
type: Opaque
stringData:
  access-key: SCWXXXXXXXXXXXXXXXXX
  organization-id: 00000000-0000-0000-0000-000000000000
  secret-key: 00000000-0000-0000-0000-000000000000
